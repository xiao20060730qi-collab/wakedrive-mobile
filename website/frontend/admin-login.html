<!doctype html>
<html lang="zh-CN">
<head>
    <meta name="copyright" content="WakeDrive (c) 2026, All Rights Reserved." />
    <script src="js/guard.js?v=20261124"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>管理员登录 · WakeDrive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css?v=20261122-3">
  <link rel="stylesheet" href="css/admin.css?v=20261019-logout1">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=20261122" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20261122" />
  </head>
<body class="admin-login">
  <canvas class="auth-particles" aria-hidden="true"></canvas>
  <main class="auth-layout">
    <section class="auth-identity" aria-label="WakeDrive 管理平台">
      <a class="auth-brand" href="index.html">
        <span class="auth-brand-mark">W</span>
        <span><strong>WakeDrive<em>·AI</em></strong><small>驾驶安全智能平台</small></span>
      </a>
      <div class="auth-visual admin-login-visual" aria-hidden="true">
        <div class="admin-network">
          <span class="admin-network-node node-one"></span><span class="admin-network-node node-two"></span><span class="admin-network-node node-three"></span><span class="admin-network-node node-four"></span>
          <div class="admin-network-core"><svg viewBox="0 0 48 48" fill="none"><path d="M24 5 39 11v12c0 9-6 15-15 20C15 38 9 32 9 23V11L24 5Z" stroke="currentColor" stroke-width="1.5"/><path d="m17 24 5 5 10-11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <span class="admin-network-caption">WAKE DRIVE · CONTROL CENTER</span>
        </div>
      </div>
      <div class="auth-identity-copy">
        <h1>每一份状态，<br>都关乎安全</h1>
        <p>汇总驾驶账户状态，及时关注疲劳风险</p>
      </div>
    </section>
    <section class="auth-form-region">
      <div class="auth-form-wrap">
        <a class="auth-back" href="login.html">← 返回用户登录</a>
        <div class="auth-heading">
          <h2>管理员登录</h2>
          <p>登录 WakeDrive 管理控制台</p>
        </div>
        <form id="adminLoginForm" novalidate>
          <div class="auth-field">
            <label for="adminUsername">管理员账号</label>
            <input id="adminUsername" name="username" autocomplete="username" maxlength="64" placeholder="请输入管理员账号" aria-describedby="adminUsernameError" required autofocus>
            <small class="field-error" id="adminUsernameError"></small>
          </div>
          <div class="auth-field">
            <label for="adminPassword">密码</label>
            <div class="password-control">
              <input id="adminPassword" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="请输入密码" aria-describedby="adminPasswordError" required>
              <button id="adminPasswordToggle" type="button" aria-label="显示密码" aria-pressed="false" title="显示密码"></button>
            </div>
            <small class="field-error" id="adminPasswordError"></small>
          </div>
          <label class="remember-control" for="adminRemember">
            <input id="adminRemember" name="remember" type="checkbox">
            <span>记住登录状态</span>
          </label>
          <div class="form-error" id="adminLoginError" role="alert"></div>
          <p class="admin-login-notice" id="adminLoginNotice" role="status"></p>
          <button class="auth-submit" id="adminLoginSubmit" type="submit">登录管理控制台 <span aria-hidden="true">→</span></button>
        </form>
        <div class="admin-login-foot"><svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="4" y="8" width="10" height="8" rx="2" stroke="currentColor"/><path d="M6 8V5a3 3 0 0 1 6 0v3" stroke="currentColor"/></svg><span>仅限授权管理员访问</span></div>
      </div>
    </section>
  </main>
  <script src="js/config.js?v=20261019-admin1"></script>
  <script src="js/admin-client.js?v=20261019-admin1"></script>
  <script src="js/admin-login.js?v=20261019-admin1"></script>
  <script src="js/auth-particles.js"></script>
</body>
</html>
